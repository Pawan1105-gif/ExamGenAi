services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: examgenai
    ports:
      - "5432:5432"
    volumes:
      - examgenai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d examgenai"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/examgenai?schema=public
      JWT_SECRET: change-me-to-a-long-random-secret-at-least-16-chars
      JWT_EXPIRES_IN: 7d
      # Fully local demo (no API keys / no extra installs)
      AI_PROVIDER: mock
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - examgenai_uploads:/app/uploads

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # In docker, the browser reaches API via host port 4000
        VITE_API_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  examgenai_pg:
  examgenai_uploads:
